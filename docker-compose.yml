version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sentinel_postgres
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_password
    volumes:
      - sentinel_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_backend
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://sentinel:sentinel_password@postgres:5432/sentinel
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      COOKIE_SECRET: change_me_in_production
      CLIENT_ORIGIN: http://localhost:5173
      JWT_SECRET: jwt_secret_change_me_in_production
      NODE_ENV: production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  sentinel_data:
