name: R1B lockfile evidence

on:
  push:
    branches: ['release/r1b-lockgen']

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Lockfile SHA-256
        run: sha256sum backend/package-lock.json frontend/package-lock.json
      - name: Verify deterministic installs
        run: |
          npm --prefix backend ci --ignore-scripts
          npm --prefix frontend ci --ignore-scripts
      - name: Verify all four npm audit scopes
        shell: bash
        run: |
          npm --prefix backend audit --omit=dev --audit-level=high
          npm --prefix backend audit --audit-level=high
          npm --prefix frontend audit --omit=dev --audit-level=high
          npm --prefix frontend audit --audit-level=high
      - name: Resolve remediated package versions
        run: |
          npm --prefix backend ls nodemailer brace-expansion js-yaml browserslist --all || true
          npm --prefix frontend ls brace-expansion js-yaml browserslist nanoid undici vitest @vitest/coverage-v8 --all || true
